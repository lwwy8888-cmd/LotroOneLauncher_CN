# Text displayed in language switching UI.
# This should be in the target language.
display_name = "简体中文"

# Name that the game uses for this language.
# The most obvious example of where this is
# used is in the client_local_{game_language_name}.dat'
# file in the game directory.
# The game has no Simplified Chinese client, so the English one is used. This
# value has to match the client_local_<name>.dat file in the game directory and
# is also passed to patchclient.dll as --language.
game_language_name = "English"

# Language code used for game server resources: newsfeed, patch file lists,
# and banner images. The game has no Simplified Chinese resources, so English
# is used instead of "zh".
resource_language = "en"
